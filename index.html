<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ropa — Catálogo de Ventas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f0f14; --card:#1a1a22; --card2:#22222c; --line:#2c2c38;
  --txt:#f2f2f7; --mut:#9a9aa8;
  --acc:#7c5cff; --acc2:#a78bff;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--txt);
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{
  width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{font-size:13px;color:var(--mut);display:block;margin:14px 0 6px}
button{cursor:pointer;border:none;background:none}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(15,15,20,.85);
  backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
}
.brand{font-size:24px;font-weight:800;letter-spacing:-.5px}
.brand span{color:var(--acc2)}
.sub{font-size:13px;color:var(--mut);margin-top:2px}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:17px}
.stat small{color:var(--mut);font-size:11px}
.searchrow{display:flex;gap:8px;margin-top:12px}
.searchrow input{margin:0}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:13px;color:var(--mut);
}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:14px 14px 0}
.o{
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mut);
  border-radius:var(--r);padding:14px;margin-bottom:10px;
}
.o .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.o h3{font-size:16px}
.o .total{font-size:16px;font-weight:700}
.o .items{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.b{font-size:11px;padding:4px 10px;border-radius:999px;font-weight:600}
.b.paid{background:rgba(34,197,94,.15);color:var(--ok)}
.b.msg{background:rgba(245,158,11,.15);color:var(--warn)}
.b.due{background:rgba(239,68,68,.15);color:var(--bad)}
.b.new{background:rgba(56,189,248,.15);color:var(--info)}
.b.mama{background:rgba(124,92,255,.18);color:var(--acc2)}
.o.act{border-color:var(--acc)}
.cuotas{display:flex;gap:4px;margin-top:10px}
.cq{flex:1;height:6px;border-radius:3px;background:var(--line)}
.cq.on{background:var(--acc)}
.fab{
  position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;background:var(--acc);
  font-size:28px;color:#fff;box-shadow:0 6px 24px rgba(124,92,255,.45);z-index:30;
}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:rgba(20,20,26,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  display:flex;
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:11px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--acc2)}
.sheet{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);
  display:none;align-items:flex-end;
}
.sheet.open{display:flex}
.sheet-in{
  background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;
  border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  animation:up .25s ease;
}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 4px}
.sheet h2{font-size:19px;margin:8px 0 4px}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prow input{flex:1}
.prow .price{max-width:110px}
.prow .del{color:var(--mut);font-size:20px;padding:8px}
.addp{width:100%;text-align:center;padding:11px;border:1px dashed var(--line);border-radius:12px;color:var(--acc2);font-size:14px}
.totalbar{
  display:flex;justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;
}
.totalbar b{color:var(--acc2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  padding:9px 14px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line);font-size:13px;color:var(--mut);
}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.big{
  width:100%;padding:15px;border-radius:14px;background:var(--acc);
  color:#fff;font-size:16px;font-weight:700;margin-top:20px;
}
.ghost{width:100%;padding:13px;border-radius:14px;background:var(--card2);color:var(--mut);margin-top:10px;font-size:14px}
.detail .item{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.detail .item span:last-child{color:var(--mut)}
.wa{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:#25d366;color:#fff;font-weight:700;margin-top:16px;
}
.empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:15px;line-height:1.6}
.empty b{display:block;font-size:17px;color:var(--txt);margin-bottom:6px}
.sett-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sett-card h3{font-size:15px;margin-bottom:4px}
.sett-card p{font-size:13px;color:var(--mut);line-height:1.5}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));
  background:var(--card2);border:1px solid var(--line);padding:11px 20px;border-radius:999px;
  font-size:14px;z-index:60;opacity:0;transition:.3s;pointer-events:none;
}
.toast.show{opacity:1}
.danger{color:var(--bad)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Ropa<span>.</span></div>
  <div class="sub" id="subtitle">Catálogo de ventas</div>
  <div class="stats" id="stats"></div>
  <div class="searchrow" id="searchrow">
    <input id="search" placeholder="Buscar cliente o producto…" inputmode="search">
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<button class="fab" id="fab" aria-label="Nuevo pedido">+</button>

<nav id="nav">
  <button data-v="orders" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18l-1.5 12h-15L3 6z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Pedidos</button>
  <button data-v="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10l2.1 2.1M19.1 4.9L17 7m-10 10l-2.1 2.1"/></svg>Ajustes</button>
</nav>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>
<div class="toast" id="toast"></div>

<script>
const ST = {
  paid:{l:"Pagado", c:"paid"},
  msg:{l:"Mensaje enviado", c:"msg"},
  due:{l:"En 2 cuotas", c:"due"},
  new:{l:"Nuevo", c:"new"},
};
const SELLERS = ["Yo","Mamá"];
const KEY="ropa_data_v1";
let db = load();
let view="orders", filter="all", query="";

function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{orders:[]}}catch(e){return{orders:[]}} }
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function fmt(n){ return "$"+Number(n||0).toLocaleString("es-MX"); }
function total(o){ return (o.items||[]).reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||1),0); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

const orderTotal = (o, os) => os.reduce((s,x)=>s+ (x.estado==="paid" ? total(x) : 0),0);

function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===view));
  const paid=db.orders.filter(o=>o.estado==="paid");
  const pend=db.orders.filter(o=>o.estado!=="paid");
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${fmt(orderTotal(null,paid))}</b><small>Cobrado</small></div>
     <div class="stat"><b>${fmt(orderTotal(null,pend))}</b><small>Por cobrar</small></div>
     <div class="stat"><b>${db.orders.length}</b><small>Pedidos</small></div>`;

  const main=document.getElementById("main");
  if(view==="settings"){ main.innerHTML=renderSettings(); wireSettings(); return; }

  const q=query.toLowerCase();
  let list=db.orders.filter(o=>{
    if(filter!=="all"&&o.estado!==filter)return false;
    if(q&&!( (o.cliente||"").toLowerCase().includes(q) || (o.items||[]).some(i=>(i.name||"").toLowerCase().includes(q)) ))return false;
    return true;
  }).sort((a,b)=>(b.created||0)-(a.created||0));

  document.getElementById("subtitle").textContent =
    view==="orders" ? "Catálogo de ventas" : "Catálogo de ventas";
  document.getElementById("searchrow").style.display = view==="orders" ? "flex":"none";
  document.getElementById("chips").style.display = view==="orders" ? "flex":"none";
  document.getElementById("fab").style.display = view==="orders" ? "block":"none";

  if(!list.length){
    main.innerHTML=`<div class="empty"><b>Sin pedidos aquí</b>Usa el botón + para registrar un pedido:<br>cliente, productos y estado.</div>`;
    return;
  }
  main.innerHTML=list.map(o=>{
    const st=ST[o.estado]||ST.new;
    const paidC=Number(o.cuotasPagadas)||0, cuotas=Number(o.cuotas)||2;
    const chips=[
      `<span class="b ${st.c}">${st.l}</span>`,
      o.vendedor==="Mamá"?`<span class="b mama">Lo tiene Mamá</span>`:"",
      (o.estado==="due"&&cuotas)?`<span class="b msg">Cuota ${Math.min(paidC+1,cuotas)} de ${cuotas}</span>`:""
    ].join("");
    const cuo = o.estado==="due" ? `<div class="cuotas">${Array.from({length:cuotas},(_,i)=>`<div class="cq ${i<paidC?"on":""}"></div>`).join("")}</div>`:"";
    return `<div class="o" data-id="${o.id}" style="border-left-color:var(--${st.c==="paid"?"ok":st.c==="msg"?"warn":st.c==="due"?"bad":"info"})">
      <div class="row1"><h3>${esc(o.cliente)||"Sin nombre"}</h3><span class="total">${fmt(total(o))}</span></div>
      <div class="items">${esc((o.items||[]).map(i=>`${i.qty>1?i.qty+"× ":""}${i.name}`).join(" · "))||"Sin productos"}</div>
      <div class="badges">${chips}</div>${cuo}</div>`;
  }).join("");
  main.querySelectorAll(".o").forEach(el=>el.onclick=()=>openOrder(el.dataset.id));
}

function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- Sheet: order editor / detail ---------- */
function openSheet(html){ document.getElementById("sheet-in").innerHTML=html; document.getElementById("sheet").classList.add("open"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); render(); }
document.getElementById("sheet").onclick=e=>{ if(e.target.id==="sheet") closeSheet(); };

function openNew(){
  openSheet(editorHTML(null));
  wireEditor(null);
}
function openOrder(id){
  const o=db.orders.find(x=>x.id===id); if(!o)return;
  const st=ST[o.estado]||ST.new;
  const items=(o.items||[]).map(i=>`<div class="item"><span>${esc(i.name)}${i.qty>1?" ×"+i.qty:""}</span><span>${fmt(i.price*i.qty)}</span></div>`).join("");
  openSheet(`<div class="detail">
    <div class="grab"></div>
    <h2>${esc(o.cliente)||"Cliente"}</h2>
    <div class="badges"><span class="b ${st.c}">${st.l}</span>${o.vendedor==="Mamá"?'<span class="b mama">Lo tiene Mamá</span>':""}</div>
    <div style="margin-top:14px">${items||""}</div>
    <div class="totalbar"><span>Total</span><b>${fmt(total(o))}</b></div>
    ${o.estado==="due"?`<div style="margin-top:14px;display:flex;gap:8px">
      <button class="ghost" style="margin:0" id="cq-minus">− Cuota</button>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px">Pagó ${Number(o.cuotasPagadas)||0} de ${o.cuotas||2}</div>
      <button class="ghost" style="margin:0" id="cq-plus">+ Cuota</button></div>`:""}
    ${o.tel?`<button class="big wa" id="waBtn">💬 Escribir por WhatsApp</button>`:""}
    <button class="big" id="editBtn">Editar pedido</button>
    <button class="ghost danger" id="delBtn">Eliminar pedido</button>
    <button class="ghost" onclick="closeSheet()">Cerrar</button>
  </div>`);
  document.getElementById("editBtn").onclick=()=>{ openSheet(editorHTML(o)); wireEditor(o); };
  document.getElementById("delBtn").onclick=()=>{
    if(!confirm("¿Eliminar este pedido?"))return;
    db.orders=db.orders.filter(x=>x.id!==id); save(); closeSheet(); toast("Pedido eliminado");
  };
  const waBtn=document.getElementById("waBtn");
  if(waBtn) waBtn.onclick=()=>{
    const msg=`Hola ${o.cliente}! Te escribo por tu pedido: ${(o.items||[]).map(i=>i.name).join(", ")}. Total ${fmt(total(o))}.`;
    window.open(`https://wa.me/${(o.tel||"").replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`,"_blank");
  };
  const bump=d=>{
    o.cuotasPagadas=Math.max(0,(Number(o.cuotasPagadas)||0)+d);
    if(o.cuotasPagadas>=(o.cuotas||2)){ o.estado="paid"; toast("¡Pedido pagado por completo!"); }
    save(); render(); openOrder(id);
  };
  if(document.getElementById("cq-plus")) document.getElementById("cq-plus").onclick=()=>bump(1);
  if(document.getElementById("cq-minus")) document.getElementById("cq-minus").onclick=()=>bump(-1);
}

function editorHTML(o){
  const isNew=!o;
  o=o||{cliente:"",tel:"",estado:"new",vendedor:"Yo",items:[{name:"",price:"",qty:1}],cuotas:2,cuotasPagadas:0,notas:""};
  return `<div class="grab"></div><h2>${isNew?"Nuevo pedido":"Editar pedido"}</h2>
  <label>Cliente</label><input id="f-cliente" value="${esc(o.cliente)}" placeholder="Nombre del cliente">
  <label>WhatsApp (opcional)</label><input id="f-tel" value="${esc(o.tel||"")}" inputmode="tel" placeholder="Ej. 55 1234 5678">
  <label>Productos y precios</label><div id="plist"></div>
  <button class="addp" id="addp">+ Agregar producto</button>
  <div class="totalbar"><span>Total</span><b id="ftotal">${fmt(total(o))}</b></div>
  <label>Estado</label><div class="seg" id="seg-est">
    ${Object.entries(ST).map(([k,v])=>`<button data-k="${k}" class="${o.estado===k?"on":""}">${v.l}</button>`).join("")}
  </div>
  <div id="cuotas-wrap" style="display:${o.estado==="due"?"block":"none"}">
    <label>Número de cuotas</label><input id="f-cuotas" type="number" min="2" max="12" value="${o.cuotas||2}">
  </div>
  <label>Vendedor / quién lo tiene</label><div class="seg" id="seg-vend">
    ${SELLERS.map(s=>`<button data-k="${s}" class="${o.vendedor===s?"on":""}">${s==="Mamá"?"Lo tiene Mamá":s}</button>`).join("")}
  </div>
  <label>Notas (opcional)</label><textarea id="f-notas" rows="2" placeholder="Ej. Entregar el viernes">${esc(o.notas||"")}</textarea>
  <button class="big" id="saveBtn">${isNew?"Guardar pedido":"Guardar cambios"}</button>
  <button class="ghost" onclick="closeSheet()">Cancelar</button>`;
}

function wireEditor(orig){
  let items=JSON.parse(JSON.stringify(orig&&orig.items&&orig.items.length?orig.items:[{name:"",price:"",qty:1}]));
  const draw=()=>{
    document.getElementById("plist").innerHTML=items.map((it,i)=>`
      <div class="prow">
        <input class="pn" data-i="${i}" value="${esc(it.name)}" placeholder="Producto">
        <input class="pp price" data-i="${i}" value="${it.price??""}" inputmode="numeric" placeholder="$">
        <button class="del" data-i="${i}">×</button>
      </div>`).join("");
    document.querySelectorAll(".pn").forEach(el=>el.oninput=()=>{items[el.dataset.i].name=el.value;});
    document.querySelectorAll(".pp").forEach(el=>el.oninput=()=>{
      items[el.dataset.i].price=Number(el.value.replace(/\D/g,""))||0; calc();
    });
    document.querySelectorAll(".prow .del").forEach(el=>el.onclick=()=>{ items.splice(el.dataset.i,1); if(!items.length)items=[{name:"",price:"",qty:1}]; draw(); calc(); });
    calc();
  };
  const calc=()=>{
    document.getElementById("ftotal").textContent=fmt(items.reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||1),0));
  };
  draw();
  document.getElementById("addp").onclick=()=>{ items.push({name:"",price:"",qty:1}); draw(); };
  let estado=orig?orig.estado:"new", vendedor=orig?orig.vendedor:"Yo";
  document.querySelectorAll("#seg-est button").forEach(b=>b.onclick=()=>{
    estado=b.dataset.k;
    document.querySelectorAll("#seg-est button").forEach(x=>x.classList.toggle("on",x===b));
    document.getElementById("cuotas-wrap").style.display=estado==="due"?"block":"none";
  });
  document.querySelectorAll("#seg-vend button").forEach(b=>b.onclick=()=>{
    vendedor=b.dataset.k;
    document.querySelectorAll("#seg-vend button").forEach(x=>x.classList.toggle("on",x===b));
  });
  document.getElementById("saveBtn").onclick=()=>{
    const cliente=document.getElementById("f-cliente").value.trim();
    if(!cliente){ toast("Escribe el nombre del cliente"); return; }
    const clean=items.filter(i=>i.name.trim());
    if(!clean.length){ toast("Agrega al menos un producto"); return; }
    const data={
      id:orig?orig.id:"o"+Date.now(),
      created:orig?orig.created:Date.now(),
      cliente, tel:document.getElementById("f-tel").value.trim(),
      estado, vendedor, items:clean,
      cuotas:estado==="due"?Math.max(2,Number(document.getElementById("f-cuotas").value)||2):2,
      cuotasPagadas:orig?Number(orig.cuotasPagadas)||0:0,
      notas:document.getElementById("f-notas").value.trim(),
    };
    if(orig) Object.assign(orig,data);
    else db.orders.push(data);
    save(); closeSheet(); toast("Guardado ✓");
  };
}

/* ---------- Settings ---------- */
function renderSettings(){
  return `<div class="grab" style="margin-top:14px"></div><h2 style="font-size:22px;margin:8px 0 14px">Ajustes</h2>
  <div class="sett-card"><h3>📥 Respaldo</h3>
    <p>Guarda una copia de todos tus pedidos en un archivo. Hazlo de vez en cuando por seguridad.</p>
    <button class="big" id="expBtn" style="margin-top:12px">Descargar respaldo</button>
    <button class="ghost" id="impBtn">Importar respaldo</button>
    <input type="file" id="impFile" accept=".json" style="display:none">
  </div>
  <div class="sett-card"><h3>📱 Instalar la app</h3>
    <p><b>iPhone:</b> abre esta página en Safari → botón Compartir → "Agregar a pantalla de inicio".<br>
    <b>Android:</b> menú ⋮ → "Instalar aplicación".</p>
  </div>
  <div class="sett-card"><h3>🗑️ Borrar todo</h3>
    <p>Elimina todos los pedidos de este teléfono. Exporta tu respaldo antes.</p>
    <button class="ghost danger" id="resetBtn" style="margin-top:12px">Borrar todos los pedidos</button>
  </div>
  <button class="ghost" id="backBtn">Volver a pedidos</button>`;
}
function wireSettings(){
  document.getElementById("backBtn").onclick=()=>{ view="orders"; render(); };
  document.getElementById("expBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="respaldo-ropa-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); toast("Respaldo descargado ✓");
  };
  document.getElementById("impBtn").onclick=()=>document.getElementById("impFile").click();
  document.getElementById("impFile").onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.orders))throw 0;
        db=d; save(); toast("Respaldo importado ✓"); view="orders"; render();
      }catch(err){ toast("Archivo no válido"); } };
    r.readAsText(f);
  };
  document.getElementById("resetBtn").onclick=()=>{
    if(!confirm("¿Seguro que quieres borrar TODOS los pedidos?"))return;
    if(!confirm("Última confirmación: esta acción no se puede deshacer."))return;
    db={orders:[]}; save(); toast("Todo borrado"); view="orders"; render();
  };
}

/* ---------- wiring ---------- */
document.getElementById("fab").onclick=openNew;
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ view=b.dataset.v; render(); });
document.getElementById("search").oninput=e=>{ query=e.target.value; render(); };

const FILTERS=[["all","Todos"],["paid",ST.paid.l],["msg",ST.msg.l],["due",ST.due.l],["new",ST.new.l]];
document.getElementById("chips").innerHTML=FILTERS.map(([k,l],i)=>
  `<button class="chip ${i===0?"on":""}" data-k="${k}">${l}</button>`).join("");
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  filter=c.dataset.k;
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  render();
});

render();
</script>
