<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ropa — Catálogo de Ventas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f0f14; --card:#1a1a22; --card2:#22222c; --line:#2c2c38;
  --txt:#f2f2f7; --mut:#9a9aa8;
  --acc:#7c5cff; --acc2:#a78bff;
  --c-green:#00c853; --c-orange:#ff9100; --c-blue:#2962ff; --c-yellow:#ffd600; --c-red:#ff1744;
  --r:16px;
}
html[data-theme="light"]{
  --bg:#f4f4f8; --card:#ffffff; --card2:#ececf2; --line:#dcdce6;
  --txt:#17171f; --mut:#6b6b7a;
  --acc:#6a4cf5; --acc2:#5b3df0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--txt);
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
  transition:background .2s;
}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{
  width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{font-size:13px;color:var(--mut);display:block;margin:14px 0 6px}
button{cursor:pointer;border:none;background:none}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
}
.toprow{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:24px;font-weight:800;letter-spacing:-.5px}
.brand span{color:var(--acc2)}
.theme-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:17px}
.sub{font-size:13px;color:var(--mut);margin-top:2px}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:17px}
.stat small{color:var(--mut);font-size:11px}
.searchrow{display:flex;gap:8px;margin-top:12px}
.searchrow input{margin:0}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;
  border:1.5px solid var(--line);font-size:13px;font-weight:600;
  background:transparent;color:var(--mut);
}
.chip.on.c-green{background:var(--c-green);border-color:var(--c-green);color:#fff}
.chip.on.c-orange{background:var(--c-orange);border-color:var(--c-orange);color:#fff}
.chip.on.c-blue{background:var(--c-blue);border-color:var(--c-blue);color:#fff}
.chip.on.c-neutral{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:14px 14px 0}
.o{
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mut);
  border-radius:var(--r);padding:14px;margin-bottom:10px;
}
.o .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.o h3{font-size:16px}
.o .total{font-size:16px;font-weight:700}
.o .items{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.b{font-size:11px;padding:4px 10px;border-radius:999px;font-weight:700;color:#fff}
.b.paid{background:var(--c-green)}
.b.msg{background:var(--c-orange)}
.b.due{background:var(--c-blue)}
.b.new{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.b.mama{background:var(--c-yellow);color:#7a5c00}
html[data-theme="light"] .b.new{background:#e8e8f0;color:#55556a}
.o.act{border-color:var(--acc)}
.cuotas{display:flex;gap:4px;margin-top:10px}
.cq{flex:1;height:6px;border-radius:3px;background:var(--line)}
.cq.on{background:var(--c-blue)}
.fab{
  position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;background:var(--acc);
  font-size:28px;color:#fff;box-shadow:0 6px 24px rgba(124,92,255,.45);z-index:30;
}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  display:flex;
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:10.5px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc2)}
.sheet{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);
  display:none;align-items:flex-end;
}
.sheet.open{display:flex}
.sheet-in{
  background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;
  border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  animation:up .25s ease;
}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 4px}
.sheet h2{font-size:19px;margin:8px 0 4px}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prow input{flex:1}
.prow .price{max-width:110px}
.prow .del{color:var(--mut);font-size:20px;padding:8px}
.addp{width:100%;text-align:center;padding:11px;border:1px dashed var(--line);border-radius:12px;color:var(--acc2);font-size:14px}
.totalbar{
  display:flex;justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;
}
.totalbar b{color:var(--acc2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  padding:9px 14px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line);font-size:13px;color:var(--mut);
}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg button.on.s-green{background:var(--c-green);border-color:var(--c-green)}
.seg button.on.s-orange{background:var(--c-orange);border-color:var(--c-orange)}
.seg button.on.s-blue{background:var(--c-blue);border-color:var(--c-blue)}
.big{
  width:100%;padding:15px;border-radius:14px;background:var(--acc);
  color:#fff;font-size:16px;font-weight:700;margin-top:20px;
}
.ghost{width:100%;padding:13px;border-radius:14px;background:var(--card2);color:var(--mut);margin-top:10px;font-size:14px}
.detail .item{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.detail .item span:last-child{color:var(--mut)}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#fff;font-weight:700;margin-top:16px}
.empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:15px;line-height:1.6}
.empty b{display:block;font-size:17px;color:var(--txt);margin-bottom:6px}
.sett-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sett-card h3{font-size:15px;margin-bottom:4px}
.sett-card p{font-size:13px;color:var(--mut);line-height:1.5}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));
  background:var(--card2);border:1px solid var(--line);padding:11px 20px;border-radius:999px;
  font-size:14px;z-index:60;opacity:0;transition:.3s;pointer-events:none;color:var(--txt);
}
.toast.show{opacity:1}
.danger{color:var(--c-red)!important}
/* inventario */
.inv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inv-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.inv-photo{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--card2)}
.inv-ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--line)}
.inv-body{padding:10px 12px}
.inv-body h4{font-size:14px;line-height:1.3}
.inv-body p{font-size:14px;font-weight:700;color:var(--acc2);margin-top:2px}
.inv-actions{display:flex;gap:6px;padding:0 12px 12px}
.inv-actions button{flex:1;padding:7px;border-radius:10px;background:var(--card2);color:var(--mut);font-size:12px}
/* clientes */
.cli{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.cli .row1{display:flex;justify-content:space-between;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.cli-id{display:flex;gap:10px;align-items:center;min-width:0}
.cli-id h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli-id p{font-size:12px;color:var(--mut)}
/* agenda */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head b{font-size:15px;text-transform:capitalize}
.cal-head button{width:34px;height:34px;border-radius:10px;background:var(--card2);color:var(--mut);font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .dow{font-size:10px;color:var(--mut);padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:10px;position:relative}
.cal-day.today{background:var(--card2);font-weight:700}
.cal-day.has{font-weight:700}
.cal-day.has::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.ev .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ev h4{font-size:15px}
.ev p{font-size:12px;color:var(--mut)}
.ev-date{font-size:12px;color:var(--mut);text-align:right;flex-shrink:0}
.sect-title{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.invpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.invpick button{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;text-align:left}
.invpick button.on{border-color:var(--acc)}
.invpick h5{font-size:12px;line-height:1.3}
.invpick p{font-size:11px;color:var(--acc2);margin-top:2px}
.invpick .thumb{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;margin-bottom:5px;background:var(--line)}
</style>
</head>
<body>

<header class="topbar">
  <div class="toprow">
    <div>
      <div class="brand">Ropa<span>.</span></div>
      <div class="sub" id="subtitle"></div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema">🌙</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="searchrow" id="searchrow">
    <input id="search" placeholder="Buscar…" inputmode="search">
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<button class="fab" id="fab" aria-label="Agregar">+</button>

<nav id="nav">
  <button data-v="agenda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4m8-4v4"/></svg>Agenda</button>
  <button data-v="orders" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18l-1.5 12h-15L3 6z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Pedidos</button>
  <button data-v="inventory">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg>Inventario</button>
  <button data-v="clients">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M17 8.5a3 3 0 1 1 .5 5.9M17.5 14.5c2.6.3 4 2 4 4.5"/></svg>Clientes</button>
  <button data-v="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10l2.1 2.1M19.1 4.9L17 7m-10 10l-2.1 2.1"/></svg>Ajustes</button>
</nav>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>
<div class="toast" id="toast"></div>

<script>
const ST = {
  paid:{l:"Pagado", c:"paid"},
  msg:{l:"Mensaje enviado", c:"msg"},
  due:{l:"En 2 cuotas", c:"due"},
  new:{l:"Nuevo", c:"new"},
};
const SELLERS=["Yo","Mamá"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DOW=["D","L","M","M","J","V","S"];
const KEY="ropa_data_v2";
let db = load();
let view="orders", filter="all", query="", calMonth=new Date().getMonth(), calYear=new Date().getFullYear();

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.orders))return Object.assign({orders:[],inventory:[],clients:[],events:[]},d);
    // migrate v1
    const v1=JSON.parse(localStorage.getItem("ropa_data_v1")||"null");
    if(v1&&Array.isArray(v1.orders))return Object.assign({orders:v1.orders,inventory:[],clients:[],events:[]},d||{});
    return {orders:[],inventory:[],clients:[],events:[]};
  }catch(e){return{orders:[],inventory:[],clients:[],events:[]}}
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function fmt(n){ return "$"+Number(n||0).toLocaleString("es-MX"); }
function total(o){ return (o.items||[]).reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||1),0); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function dstr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fdate(s){ if(!s)return""; const [y,m,d]=s.split("-"); return d+" de "+MESES[+m-1]+(+y!==new Date().getFullYear()?" de "+y:""); }

/* ---------- theme ---------- */
function applyTheme(){
  const t=db.theme||"dark";
  document.documentElement.dataset.theme=t;
  document.getElementById("themeBtn").textContent=t==="dark"?"🌙":"☀️";
}
document.getElementById("themeBtn").onclick=()=>{
  db.theme=(db.theme||"dark")==="dark"?"light":"dark";
  save(); applyTheme();
};

/* ---------- sheet ---------- */
function openSheet(html){ document.getElementById("sheet-in").innerHTML=html; document.getElementById("sheet").classList.add("open"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); render(); }
document.getElementById("sheet").onclick=e=>{ if(e.target.id==="sheet") closeSheet(); };

/* ---------- find / upsert client ---------- */
function findClient(o){
  return db.clients.find(c=>c.id===o.clienteId || (c.name||"").toLowerCase()===(o.cliente||"").toLowerCase());
}
function upsertClient(o){
  let c=findClient(o);
  if(!c){ c={id:uid("c"),name:o.cliente,tel:o.tel||"",notas:"",created:Date.now()}; db.clients.push(c); }
  if(o.tel&&!c.tel)c.tel=o.tel;
  o.clienteId=c.id;
  return c;
}

/* ================= RENDER ================= */
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===view));
  const paid=db.orders.filter(o=>o.estado==="paid");
  const pend=db.orders.filter(o=>o.estado!=="paid");
  const sum=a=>a.reduce((s,x)=>s+total(x),0);
  document.getElementById("subtitle").textContent=
    {agenda:"Tu agenda",orders:"Catálogo de ventas",inventory:"Inventario de productos",clients:"Tus clientes",settings:"Configuración"}[view];
  document.getElementById("stats").innerHTML =
    (view==="orders")
    ?`<div class="stat"><b>${fmt(sum(paid))}</b><small>Cobrado</small></div>
      <div class="stat"><b>${fmt(sum(pend))}</b><small>Por cobrar</small></div>
      <div class="stat"><b>${db.orders.length}</b><small>Pedidos</small></div>`
    :(view==="inventory")
    ?`<div class="stat"><b>${db.inventory.length}</b><small>Productos</small></div>`
    :(view==="clients")
    ?`<div class="stat"><b>${db.clients.length}</b><small>Clientes</small></div>`
    :(view==="agenda")
    ?`<div class="stat"><b>${db.events.length}</b><small>Eventos</small></div>`
    :``;
  document.getElementById("searchrow").style.display = ["orders","inventory","clients"].includes(view)?"flex":"none";
  document.getElementById("chips").style.display = view==="orders"?"flex":"none";
  document.getElementById("fab").style.display = ["orders","inventory","clients","agenda"].includes(view)?"block":"none";

  const main=document.getElementById("main");
  if(view==="orders")return renderOrders(main);
  if(view==="inventory")return renderInventory(main);
  if(view==="clients")return renderClients(main);
  if(view==="agenda")return renderAgenda(main);
  main.innerHTML=renderSettings(); wireSettings();
}

/* ---------- Pedidos ---------- */
function renderOrders(main){
  const q=query.toLowerCase();
  let list=db.orders.filter(o=>{
    if(filter!=="all"&&o.estado!==filter)return false;
    if(q&&!( (o.cliente||"").toLowerCase().includes(q) || (o.items||[]).some(i=>(i.name||"").toLowerCase().includes(q)) ))return false;
    return true;
  }).sort((a,b)=>(b.created||0)-(a.created||0));
  if(!list.length){ main.innerHTML=`<div class="empty"><b>Sin pedidos aquí</b>Usa el botón + para registrar un pedido:<br>cliente, productos y estado.</div>`; return; }
  main.innerHTML=list.map(o=>{
    const st=ST[o.estado]||ST.new;
    const paidC=Number(o.cuotasPagadas)||0, cuotas=Number(o.cuotas)||2;
    const chips=[
      `<span class="b ${st.c}">${st.l}</span>`,
      o.vendedor==="Mamá"?`<span class="b mama">Lo tiene Mamá</span>`:"",
      (o.estado==="due"&&cuotas)?`<span class="b msg">Cuota ${Math.min(paidC+1,cuotas)} de ${cuotas}</span>`:""
    ].join("");
    const cuo=o.estado==="due"?`<div class="cuotas">${Array.from({length:cuotas},(_,i)=>`<div class="cq ${i<paidC?"on":""}"></div>`).join("")}</div>`:"";
    return `<div class="o" data-id="${o.id}" style="border-left-color:var(--c-${st.c==="paid"?"green":st.c==="msg"?"orange":st.c==="due"?"blue":"yellow"})">
      <div class="row1"><h3>${esc(o.cliente)||"Sin nombre"}</h3><span class="total">${fmt(total(o))}</span></div>
      <div class="items">${esc((o.items||[]).map(i=>`${i.qty>1?i.qty+"× ":""}${i.name}`).join(" · "))||"Sin productos"}${o.fecha?`<br>📅 ${fdate(o.fecha)}`:""}</div>
      <div class="badges">${chips}</div>${cuo}</div>`;
  }).join("");
  main.querySelectorAll(".o").forEach(el=>el.onclick=()=>openOrder(el.dataset.id));
}

/* ---------- Inventario ---------- */
function renderInventory(main){
  const q=query.toLowerCase();
  const list=db.inventory.filter(i=>!q||(i.name||"").toLowerCase().includes(q));
  if(!list.length){ main.innerHTML=`<div class="empty"><b>Inventario vacío</b>Agrega tus productos con nombre, precio y foto.<br>Luego podrás elegirlos al crear un pedido.</div>`; return; }
  main.innerHTML=`<div class="inv">`+list.map(i=>`
    <div class="inv-card">
      ${i.photo?`<img class="inv-photo" src="${i.photo}">`:`<div class="inv-ph">👗</div>`}
      <div class="inv-body"><h4>${esc(i.name)}</h4><p>${fmt(i.price)}</p></div>
      <div class="inv-actions">
        <button data-act="edit" data-id="${i.id}">Editar</button>

function compressPhoto(file, cb){
  const img=new Image(), r=new FileReader();
  r.onload=()=>{ img.onload=()=>{
    const MAX=480, sc=Math.min(1, MAX/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=img.width*sc; c.height=img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",.72));
  }; img.src=r.result; };
  r.readAsDataURL(file);
}

/* ---------- Agenda ---------- */
function renderAgenda(main){
  const ordersByDate={};
  db.orders.forEach(o=>{ if(o.fecha)(ordersByDate[o.fecha]=ordersByDate[o.fecha]||[]).push(o); });
  const evByDate={};
  db.events.forEach(e=>{ if(e.date)(evByDate[e.date]=evByDate[e.date]||[]).push(e); });
  const first=new Date(calYear,calMonth,1);
  const startDow=first.getDay(), days=new Date(calYear,calMonth+1,0).getDate();
  const today=dstr(new Date());
  let cells="";
  for(let i=0;i<startDow;i++)cells+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const ds=dstr(new Date(calYear,calMonth,d));
    const has=(ordersByDate[ds]||evByDate[ds])?"has":"";
    cells+=`<div class="cal-day ${ds===today?"today":""} ${has}">${d}</div>`;
  }
  const allDates=[...new Set([...Object.keys(ordersByDate),...Object.keys(evByDate)].filter(Boolean))].sort();
  const nowDs=dstr(new Date());
  const past=allDates.filter(d=>d<nowDs).reverse();
  const future=allDates.filter(d=>d>=nowDs);
  const evRow=(ds,extra)=>`
    ${(evByDate[ds]||[]).map(e=>`<div class="ev" data-ev="${e.id}"><div class="dot" style="background:var(--acc)"></div>
      <div style="flex:1;min-width:0"><h4>${esc(e.title)}</h4><p>${esc(e.cliente||"")}</p></div>
      <div class="ev-date">${fdate(ds)}</div></div>`).join("")}
    ${(ordersByDate[ds]||[]).map(o=>{
      const st=ST[o.estado]||ST.new;
      return `<div class="o" data-id="${o.id}" style="border-left-color:var(--c-${st.c==="paid"?"green":st.c==="msg"?"orange":st.c==="due"?"blue":"yellow"})">
        <div class="row1"><h3>${esc(o.cliente)}</h3><span class="total">${fmt(total(o))}</span></div>
        <div class="items">${esc((o.items||[]).map(i=>i.name).join(" · "))}</div>
        <div class="badges"><span class="b ${st.c}">${st.l}</span></div></div>`;
    }).join("")}`;
  main.innerHTML=`
    <div class="cal">
      <div class="cal-head">
        <button id="cal-prev">‹</button><b id="cal-title">${MESES[calMonth]} ${calYear}</b><button id="cal-next">›</button>
      </div>
      <div class="cal-grid">${DOW.map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
    </div>
    <div class="sect-title">Próximos</div>
    ${future.length?future.map(ds=>evRow(ds)).join(""):`<p style="font-size:13px;color:var(--mut);padding:4px 2px">Nada agendado a futuro.</p>`}
    ${(db.events.filter(e=>!e.date).length)?`<div class="sect-title">Sin fecha</div>${db.events.filter(e=>!e.date).map(e=>`
      <div class="ev" data-ev="${e.id}"><div class="dot" style="background:var(--line)"></div>
      <div style="flex:1;min-width:0"><h4>${esc(e.title)}</h4><p>Toca para ponerle fecha</p></div></div>`).join("")}`:""}
    ${past.length?`<div class="sect-title">Pasados</div>${past.map(ds=>evRow(ds)).join("")}`:""}`;
  document.getElementById("cal-prev").onclick=()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); };
  document.getElementById("cal-next").onclick=()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); };
  main.querySelectorAll(".ev").forEach(el=>el.onclick=()=>openEvent(el.dataset.ev));
  main.querySelectorAll(".o").forEach(el=>el.onclick=()=>openOrder(el.dataset.id));
}

    <label>Notas (opcional)</label><textarea id="f-notas" rows="2" placeholder="Ej. Entregar el viernes">${esc(base.notas||"")}</textarea>

    <button class="ghost" onclick="closeSheet()">Cancelar</button>`);

  let items=JSON.parse(JSON.stringify(base.items&&base.items.length?base.items:[{name:"",price:"",qty:1}]));
  let mode="inv", estado=base.estado, vendedor=base.vendedor;
  let picked={}; // iid -> {qty, price}

  const calc=()=>{
    let t=0;
    if(mode==="inv")Object.values(picked).forEach(p=>t+=(Number(p.price)||0)*(p.qty||1));
    else t=items.reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||1),0);
    document.getElementById("ftotal").textContent=fmt(t);
  };
  const drawInv=()=>{
    document.getElementById("mode-inv").innerHTML=invHtml(Object.keys(picked));
    document.querySelectorAll("#mode-inv .invpick button").forEach(b=>b.onclick=()=>{
      const inv=db.inventory.find(x=>x.id===b.dataset.iid);
      if(picked[b.dataset.iid]){ delete picked[b.dataset.iid]; }
      else picked[b.dataset.iid]={qty:1,price:inv.price};
      drawInv(); calc();
    });
  };
  const drawMan=()=>{
    document.getElementById("plist").innerHTML=items.map((it,i)=>`

    document.querySelectorAll(".prow .del").forEach(el=>el.onclick=()=>{ items.splice(el.dataset.i,1); if(!items.length)items=[{name:"",price:"",qty:1}]; drawMan(); calc(); });
  };
  drawInv(); drawMan(); calc();
  document.querySelectorAll("#mode-seg button").forEach(b=>b.onclick=()=>{

  };
  document.getElementById("saveBtn").onclick=()=>{
    const cliente=document.getElementById("f-cliente").value.trim();
    if(!cliente){ toast("Escribe el nombre del cliente"); return; }
    let clean;
    if(mode==="inv"){
      clean=Object.keys(picked).map(iid=>{
        const inv=db.inventory.find(x=>x.id===iid);
        return {name:inv.name, price:Number(picked[iid].price)||inv.price||0, qty:picked[iid].qty||1};

    }else{
      clean=items.filter(i=>i.name.trim());
      if(!clean.length){ toast("Agrega al menos un producto"); return; }
      clean.forEach(i=>i.qty=i.qty||1);

      fecha:document.getElementById("f-fecha").value,
      notas:document.getElementById("f-notas").value.trim(),
    };
    if(orig)Object.assign(orig,data);
    else db.orders.push(data);
    upsertClient(orig||data);
    save(); closeSheet(); toast("Guardado ✓");
  };
}

  };
  const bump=d=>{
    o.cuotasPagadas=Math.max(0,(Number(o.cuotasPagadas)||0)+d);
    if(o.cuotasPagadas>=(o.cuotas||2)){ o.estado="paid"; toast("¡Pedido pagado por completo!"); }
    save(); render(); openOrder(id);
  };
  if(document.getElementById("cq-plus"))document.getElementById("cq-plus").onclick=()=>bump(1);
  if(document.getElementById("cq-minus"))document.getElementById("cq-minus").onclick=()=>bump(-1);
}
function editorShell(o){ openEditor(o); }

/* ---------- Ajustes ---------- */
function renderSettings(){
  return `<div class="grab" style="margin-top:14px"></div><h2 style="font-size:22px;margin:8px 0 14px">Ajustes</h2>
  <div class="sett-card"><h3>🌗 Apariencia</h3>
    <p>Cambia entre modo oscuro y claro (también con el botón de arriba).</p>
    <button class="ghost" id="themeBtn2" style="margin-top:12px">Cambiar a modo ${((db.theme||"dark")==="dark")?"claro ☀️":"oscuro 🌙"}</button>
  </div>
  <div class="sett-card"><h3>📥 Respaldo</h3>
    <p>Guarda una copia de pedidos, inventario, clientes y agenda en un archivo.</p>
    <button class="big" id="expBtn" style="margin-top:12px">Descargar respaldo</button>
    <button class="ghost" id="impBtn">Importar respaldo</button>
    <input type="file" id="impFile" accept=".json" style="display:none">
  </div>
  <div class="sett-card"><h3>📱 Instalar la app</h3>
    <p><b>iPhone:</b> abre esta página en Safari → Compartir → "Agregar a pantalla de inicio".<br>
    <b>Android:</b> menú ⋮ → "Instalar aplicación".</p>
  </div>
  <div class="sett-card"><h3>🗑️ Borrar todo</h3>
    <p>Elimina todos los datos de este teléfono. Exporta tu respaldo antes.</p>
    <button class="ghost danger" id="resetBtn" style="margin-top:12px">Borrar todos los datos</button>
  </div>
  <button class="ghost" id="backBtn">Volver a pedidos</button>`;
}
function wireSettings(){
  document.getElementById("backBtn").onclick=()=>{ view="orders"; render(); };
  const t2=document.getElementById("themeBtn2");
  if(t2)t2.onclick=()=>{ db.theme=(db.theme||"dark")==="dark"?"light":"dark"; save(); applyTheme(); view="settings"; render(); };
  document.getElementById("expBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="respaldo-ropa-"+dstr(new Date())+".json";
    a.click(); toast("Respaldo descargado ✓");
  };
  document.getElementById("impBtn").onclick=()=>document.getElementById("impFile").click();
  document.getElementById("impFile").onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.orders))throw 0;
        db=Object.assign({orders:[],inventory:[],clients:[],events:[],theme:db.theme},d);
        save(); toast("Respaldo importado ✓"); view="orders"; render();
      }catch(err){ toast("Archivo no válido"); } };
    r.readAsText(f);
  };
  document.getElementById("resetBtn").onclick=()=>{
    if(!confirm("¿Seguro que quieres borrar TODO?"))return;
    if(!confirm("Última confirmación: no se puede deshacer."))return;
    db={orders:[],inventory:[],clients:[],events:[],theme:db.theme}; save(); toast("Todo borrado"); view="orders"; render();
  };
}

document.getElementById("fab").onclick=()=>{
  if(view==="orders")openEditor(null);
  else if(view==="inventory")openInvEditor(null);
  else if(view==="clients")openNewClient();
  else if(view==="agenda")openEventEditor(null);
};
function openNewClient(){
  openSheet(`<div class="grab"></div><h2>Nuevo cliente</h2>
    <label>Nombre</label><input id="nc-name" placeholder="Nombre del cliente">
    <label>WhatsApp</label><input id="nc-tel" inputmode="tel" placeholder="Ej. 55 1234 5678">
    <label>Notas</label><textarea id="nc-notas" rows="2"></textarea>
    <button class="big" id="nc-save">Guardar cliente</button>
    <button class="ghost" onclick="closeSheet()">Cancelar</button>`);
  document.getElementById("nc-save").onclick=()=>{
    const name=document.getElementById("nc-name").value.trim();
    if(!name){ toast("Escribe el nombre"); return; }
    db.clients.push({id:uid("c"),name,tel:document.getElementById("nc-tel").value.trim(),notas:document.getElementById("nc-notas").value.trim(),created:Date.now()});
    save(); closeSheet(); toast("Cliente guardado ✓");
  };
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ view=b.dataset.v; render(); });
document.getElementById("search").oninput=e=>{ query=e.target.value; render(); };

document.getElementById("chips").innerHTML=FILTERS.map(([k,l,c],i)=>

document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{

applyTheme();
render();
